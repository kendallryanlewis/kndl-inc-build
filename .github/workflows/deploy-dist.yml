name: Build and Deploy to Prod Repo

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: |
          npm run build --prod || npm run build || ng build --prod || ng build

      - name: List dist contents (debug)
        run: |
          echo "Contents of ./dist:"
          ls -la ./dist || echo "No ./dist folder"
          echo "Contents of ./dist/kndl-inc:"
          ls -la ./dist/kndl-inc || echo "No ./dist/kndl-inc folder"
          echo "Find all index.html files:"
          find . -name "index.html" -type f

      - name: Deploy dist to prod repo
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.DEPLOY_TOKEN }}
          external_repository: kendallryanlewis/kndl-inc
          publish_dir: ./dist/kndl-inc
          publish_branch: main
          user_name: github-actions
          user_email: github-actions@github.com
          force_orphan: true
