<div class="login-container">
    <div class="login-wrapper p-2 p-md-5">
        <!-- Left Panel - Login Form -->
        <div class="login-panel" appAnimateOnScroll animationClass="fade" style="transition-delay: 0.3s;">
            <div class="login-content p-3 p-md-0">
                <!-- Header -->
                <div class="login-header">
                    <div class="logo">
                        <a routerLink="/" class="logo-text" style="text-decoration: none; color: inherit;">
                            Home
                        </a>
                    </div>
                </div>

                <!-- Main Form -->
                <div class="form-section">
                    <h1 class="form-title">Create an account</h1>
                    <p class="form-subtitle">Enter your details to get started</p>

                    <form class="login-form" (ngSubmit)="onSubmit($event)">
                        <!-- Email Input -->
                        <div class="form-group">
                            <label for="email" class="form-label">Email address</label>
                            <input type="email" id="email" class="form-input" placeholder="kendall@example.com" required
                                [(ngModel)]="email" name="email">
                        </div>

                        <!-- Password Input -->
                        <div class="form-group">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" id="password" class="form-input" placeholder="Enter your password"
                                required [(ngModel)]="password" name="password">
                        </div>

                        <!-- Error Message -->
                        <div *ngIf="error" class="text-danger mb-3" style="font-size:0.95rem;">{{ error }}</div>

                        <!-- Submit Button -->
                        <button type="submit" class="submit-btn">
                            Submit
                        </button>
                    </form>

                    <!-- Terms -->
                    <p class="terms-text">
                        By creating an account, you agree to our
                        <a href="#" class="terms-link">Terms & Conditions</a>
                    </p>
                </div>
            </div>
        </div>

        <!-- Right Panel - Hero Image -->
        <div class="hero-panel d-none d-md-block" appAnimateOnScroll animationClass="fade-right"
            style="transition-delay: 0.3s;">
            <div class="hero-content bg-black">
                <div class="hero-image opacity-25">
                </div>
            </div>
        </div>
    </div>
</div>
