<div class="addons-editor">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <app-generic-h2-title [title]="'Add-ons Manager'" [icon]="'fa fa-puzzle-piece'"
            [subTitle]="'Manage your add-on products effectively'">
        </app-generic-h2-title>
        <div class="d-flex gap-2">
            <button class="btn btn-outline-secondary" (click)="toggleArchivedPlans()">
                <i class="fa" [ngClass]="showingArchivedPlans ? 'fa-eye-slash' : 'fa-eye'"></i>
                {{ toggleButtonText }}
            </button>
            <app-generic-button [title]="'Add New Addon'" [action]="createNewAddon" [icon]="'fa fa-plus-circle'">
            </app-generic-button>
        </div>
    </div>

    <!-- Loading State -->
    <div *ngIf="isLoading" class="text-center py-4">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading add-on products...</span>
        </div>
        <p class="mt-2 text-muted">Loading add-on products...</p>
    </div>

    <!-- Addon Products Grid -->
    <div *ngIf="!isLoading" class="row">
        <div class="col-md-4 mb-4" *ngFor="let addon of filteredAddonProducts">
            <app-subscription-card [product]="addon" [cardType]="'addon'" [showActions]="true" [showEdit]="true"
                [showDelete]="false" [customActions]="getAddonActions(addon)" (editClicked)="onEditAddon(addon)"
                (customActionClicked)="onCustomAction($event)">
            </app-subscription-card>
        </div>
    </div>

    <!-- Empty State -->
    <div *ngIf="!isLoading && filteredAddonProducts.length === 0" class="text-center py-5">
        <i class="fas fa-puzzle-piece fa-3x text-muted mb-3"></i>
        <h4 class="text-muted">No add-on products found</h4>
        <p class="text-muted">Add-on products will appear here when they are loaded from Stripe.</p>
    </div>
</div>

<!-- Addon Modal -->
<div class="modal-backdrop" *ngIf="showAddonModal" (click)="closeAddonModal()">
    <div class="user-modal-container" (click)="$event.stopPropagation()">
        <div class="modal-header">
            <h2 class="modal-title">
                <i class="fa fa-puzzle-piece"></i>
                {{ selectedAddon?.stripeProductId ? 'Edit Add-on' : 'Create New Add-on' }}
            </h2>
            <button type="button" class="close-btn" (click)="closeAddonModal()" aria-label="Close">
                <i class="fa fa-times"></i>
            </button>
        </div>

        <div class="modal-body" *ngIf="selectedAddon">
            <!-- Success/Error Messages -->
            <div class="alert alert-success" *ngIf="successMessage">
                <i class="fa fa-check-circle"></i>
                {{ successMessage }}
            </div>
            <div class="alert alert-danger" *ngIf="errorMessage">
                <i class="fa fa-exclamation-circle"></i>
                {{ errorMessage }}
            </div>

            <!-- Basic Information -->
            <div class="form-group">
                <label for="addonName" class="form-label">Add-on Name *</label>
                <input type="text" id="addonName" class="form-control" [(ngModel)]="selectedAddon.name" name="addonName"
                    placeholder="Enter add-on name" required>
            </div>

            <div class="form-group">
                <label for="addonDescription" class="form-label">Description *</label>
                <textarea id="addonDescription" class="form-control" rows="3" [(ngModel)]="selectedAddon.description"
                    name="addonDescription" placeholder="Describe what this add-on provides..." required></textarea>
            </div>

            <!-- Pricing -->
            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="addonPrice" class="form-label">Price *</label>
                        <div class="input-group">
                            <span class="input-group-text">$</span>
                            <input type="number" id="addonPrice" class="form-control" [(ngModel)]="selectedAddon.price"
                                name="addonPrice" placeholder="0.00" step="0.01" min="0" required>
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="addonCurrency" class="form-label">Currency</label>
                        <select id="addonCurrency" class="form-control" [(ngModel)]="selectedAddon.currency"
                            name="addonCurrency">
                            <option value="usd">USD ($)</option>
                            <option value="eur">EUR (€)</option>
                            <option value="gbp">GBP (£)</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Features -->
            <div class="form-group">
                <label class="form-label">Features</label>
                <div class="features-container">
                    <div class="feature-item d-flex align-items-center mb-2"
                        *ngFor="let feature of selectedAddon.features; let i = index; trackBy: trackFeature">
                        <div class="flex-grow-1 me-2">
                            <input type="text" class="form-control" [(ngModel)]="selectedAddon.features[i]"
                                [name]="'feature' + i" placeholder="Enter feature description">
                        </div>
                        <button type="button" class="btn btn-outline-danger btn-sm" (click)="removeFeature(i)"
                            [disabled]="selectedAddon.features.length <= 1" title="Remove feature">
                            <i class="fa fa-trash"></i>
                        </button>
                    </div>
                    <button type="button" class="btn btn-outline-primary btn-sm mt-2" (click)="addFeature()">
                        <i class="fa fa-plus"></i> Add Feature
                    </button>
                </div>
            </div>

            <!-- Settings -->
            <div class="row">
                <div class="col-md-6">
                    <div class="form-check">
                        <input type="checkbox" id="isRecurring" class="form-check-input"
                            [(ngModel)]="selectedAddon.isRecurring" name="isRecurring">
                        <label for="isRecurring" class="form-check-label">
                            <strong>Recurring billing</strong>
                        </label>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-check">
                        <input type="checkbox" id="isPopular" class="form-check-input"
                            [(ngModel)]="selectedAddon.isPopular" name="isPopular">
                        <label for="isPopular" class="form-check-label">
                            <strong>Popular add-on</strong>
                        </label>
                    </div>
                </div>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" (click)="closeAddonModal()" [disabled]="isSaving">
                    <i class="fa fa-times"></i> Cancel
                </button>
                <button type="button" class="btn btn-primary" (click)="saveAddon()" [disabled]="isSaving">
                    <i class="fa fa-spinner fa-spin" *ngIf="isSaving"></i>
                    <i class="fa" [ngClass]="selectedAddon.stripeProductId ? 'fa-save' : 'fa-plus'"
                        *ngIf="!isSaving"></i>
                    {{ isSaving ? 'Saving...' : (selectedAddon.stripeProductId ? 'Update Add-on' : 'Create Add-on') }}
                </button>
            </div>
        </div>
    </div>
</div>
