<!-- Fixed Save Controls with Change Tracking -->
<div class="bottom-0 end-0 position-fixed p-5" style="z-index: 1050;"
    *ngIf="subTab == 'Home' || subTab == 'About Us' || subTab == 'Services' || subTab == 'Enhancements' || subTab == 'Call to Action'">
    <div class="d-flex flex-column gap-2">
        <!-- Enhanced Changed Sections Indicator -->
        <div class="card border-warning" *ngIf="hasUnsavedChanges">
            <div class="card-body p-2">
                <small class="text-warning fw-bold">
                    <i class="fa fa-exclamation-triangle-fill me-1"></i>
                    Unsaved Changes ({{ changedSectionsList.length }}):
                </small>
                <ul class="mb-0 mt-1" style="font-size: 0.75rem;">
                    <li *ngFor="let section of getChangedSectionNames(); trackBy: trackBySection"
                        class="d-flex align-items-center">
                        <i class="fa fa-dot text-warning me-1"></i>
                        {{ section }}
                    </li>
                </ul>
                <small class="text-muted mt-1 d-block">
                    Changes are preserved across all tabs
                </small>
            </div>
        </div>

        <!-- Save Button -->
        <button type="button" class="btn" [ngClass]="saveButtonClass" [disabled]="isSaving" (click)="saveSiteLayout()">
            <i class="fa fa-cloud-upload-fill me-1" *ngIf="!isSaving"></i>
            <div class="spinner-border spinner-border-sm me-1" *ngIf="isSaving" role="status"></div>
            {{ saveButtonText }}
        </button>

        <!-- Last Saved Time -->
        <small class="text-muted text-center" *ngIf="lastSaved">
            Last saved: {{ lastSaved | date:'short' }}
        </small>
    </div>
</div>

<!-- Home Content Template -->
<ng-template #homeContent>
    <div class="landing-editor-container">
        <app-generic-h2-title [title]="'Site Editor'" [icon]="'fa-edit'"
            [subTitle]="'Edit main landing page sections and preview changes in real-time.'"></app-generic-h2-title>
        <div id="main" class="section-content">
            <app-kndl-about [content]="aboutData" [editMode]="true" (dataChange)="onAboutDataChange($event)"
                *ngIf="aboutData"></app-kndl-about>
            <p class="m-0 fw-bold">Main Message</p>
            <div class="flex-grow-1 d-none d-lg-flex flex-column mt-3">
                <input type="text" class="form-control text-start mb-3" [(ngModel)]="headerSubText"
                    (ngModelChange)="onHeaderSubTextChange($event)" placeholder="Enter header sub text" />
                <p class="m-0 fw-bold">Sub Message</p>
            </div>

            <!-- Preview of all sections in main view with lazy loading -->
            <div class="preview-sections" *ngIf="!isLoading; else loadingTemplate">
                <ng-container *ngFor="let preview of previewSections; trackBy: trackByPreview">
                    <div class="preview-section stat-card" *ngIf="shouldShowPreview(preview.key)">
                        <h3>{{ preview.title }}</h3>
                        <ng-container [ngSwitch]="preview.key">
                            <app-kndl-about-us *ngSwitchCase="'aboutUs'" [inputContent]="aboutUsData"
                                [editMode]="false"></app-kndl-about-us>
                            <app-kndl-detailed-services *ngSwitchCase="'detailedServices'"
                                [content]="detailedServicesData" [editMode]="false"></app-kndl-detailed-services>
                            <app-kndl-add-ons *ngSwitchCase="'addOns'" [content]="addOnsData"
                                [editMode]="false"></app-kndl-add-ons>
                            <app-kndl-call-to-action *ngSwitchCase="'callToAction'" [content]="callToActionData"
                                [editMode]="false"></app-kndl-call-to-action>
                        </ng-container>
                    </div>
                </ng-container>
            </div>

            <!-- Loading template for previews -->
            <ng-template #loadingTemplate>
                <div class="preview-sections stat-card">
                    <div class="preview-section" *ngFor="let i of [1,2,3,4]">
                        <div class="d-flex justify-content-center p-4">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Loading preview...</span>
                            </div>
                        </div>
                    </div>
                </div>
            </ng-template>
        </div>
    </div>
</ng-template>


<ng-container [ngSwitch]="subTab">
    <!-- Home Tab -->
    <ng-container *ngSwitchCase="'Home'">
        <ng-container *ngTemplateOutlet="homeContent"></ng-container>
    </ng-container>

    <!-- Other Tabs with Change Tracking -->
    <app-kndl-about-us *ngSwitchCase="'About Us'" [inputContent]="aboutUsData" [editMode]="true"
        (dataChange)="onAboutUsDataChange($event)"></app-kndl-about-us>

    <app-kndl-detailed-services *ngSwitchCase="'Services'" [content]="detailedServicesData" [editMode]="true"
        (dataChange)="onDetailedServicesDataChange($event)"></app-kndl-detailed-services>

    <app-kndl-add-ons *ngSwitchCase="'Enhancements'" [content]="addOnsData" [editMode]="true"
        (dataChange)="onAddOnsDataChange($event)"></app-kndl-add-ons>

    <app-kndl-call-to-action *ngSwitchCase="'Call to Action'" [content]="callToActionData" [editMode]="true"
        (dataChange)="onCallToActionDataChange($event)"></app-kndl-call-to-action>

    <!-- Stripe products -->
    <app-subscription-editor *ngSwitchCase="'Subscriptions'" (dataChange)="onSubscriptionDataChange($event)"
        [subscriptionPlans]="subscriptionPlans" [isLoading]="isLoadingStripeProducts"></app-subscription-editor>

    <app-service-plans-editor *ngSwitchCase="'Service Plans'" (dataChange)="onServicePlansDataChange($event)"
        [oneTimeProducts]="oneTimeProducts" [isLoading]="isLoadingStripeProducts"></app-service-plans-editor>

    <app-addons-editor *ngSwitchCase="'Add-Ons'" (dataChange)="onAddonDataChange($event)"
        [addonProducts]="addonProducts" [isLoading]="isLoadingStripeProducts"></app-addons-editor>

    <!-- Default case - show Home when subTab is empty, undefined, or doesn't match any case -->
    <ng-container *ngSwitchDefault>
        <ng-container *ngTemplateOutlet="homeContent"></ng-container>
    </ng-container>
</ng-container>
