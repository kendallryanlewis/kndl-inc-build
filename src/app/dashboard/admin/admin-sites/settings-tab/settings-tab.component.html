<form #settingsForm="ngForm" (ngSubmit)="onSaveCompanySettings()">
    <div class="row g-3">
        <div class="col-md-6">
            <div class="form-group mb-3">
                <label class="small text-muted fw-bold">Company Name <span class="text-danger">*</span></label>
                <input type="text" class="form-control form-control-sm" [(ngModel)]="selectedCompany!.name"
                    name="companyName" required #companyName="ngModel" (blur)="onUpdateCompanyName(companyName.value)"
                    placeholder="Enter company name">
                <div *ngIf="companyName.invalid && companyName.touched" class="text-danger small">
                    Company name is required
                </div>
            </div>
            <div class="form-group mb-3">
                <label class="small text-muted fw-bold">Status</label>
                <select class="form-control form-control-sm" [(ngModel)]="selectedCompany!.status" name="status"
                    #status="ngModel" (change)="onUpdateCompanyStatus(status.value)">
                    <option value="active">Active</option>
                    <option value="pending">Pending</option>
                    <option value="suspended">Suspended</option>
                    <option value="inactive">Inactive</option>
                </select>
                <small class="text-muted fw-bold">
                    Current status:
                    <span class="badge rounded-pill ms-1" [ngClass]="{
                                            'bg-success': selectedCompany!.status === 'active',
                                            'bg-warning': selectedCompany!.status === 'pending',
                                            'bg-danger': selectedCompany!.status === 'suspended',
                                            'bg-secondary': selectedCompany!.status === 'inactive'
                                        }">
                        {{ selectedCompany!.status | titlecase }}
                    </span>
                </small>
            </div>
        </div>
        <div class="col-md-6">
            <div class="form-group mb-3">
                <label class="small text-muted fw-bold">Domain <span class="text-danger">*</span></label>
                <input type="text" class="form-control form-control-sm" [(ngModel)]="selectedCompany!.domain"
                    name="domain" required #domain="ngModel" (blur)="onUpdateCompanyDomain(domain.value)"
                    placeholder="example.com">
                <div *ngIf="domain.invalid && domain.touched" class="text-danger small">
                    Domain is required
                </div>
            </div>
            <div class="form-group mb-3">
                <label class="small text-muted fw-bold">Phone</label>
                <input type="tel" class="form-control form-control-sm" [(ngModel)]="selectedCompany!.phone" name="phone"
                    #phone="ngModel" (blur)="onUpdateCompanyPhone(phone.value)" placeholder="+1 (555) 123-4567">
            </div>
        </div>
    </div>
    <div class="form-group mb-3 row">
        <label class="small text-muted fw-bold">Contact Email <span class="text-danger">*</span></label>
        <input type="email" class="form-control form-control-sm" [(ngModel)]="selectedCompany!.contactEmail"
            name="email" required email #email="ngModel" (blur)="onUpdateCompanyEmail(email.value)"
            placeholder="admin@company.com">
        <div *ngIf="email.invalid && email.touched" class="text-danger small">
            <span *ngIf="email.errors?.['required']">Email is required</span>
            <span *ngIf="email.errors?.['email']">Please enter a valid
                email</span>
        </div>
    </div>
    <div class="form-group mb-3">
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary btn-sm flex-grow-1 text-center"
                [disabled]="settingsForm.invalid">
                <i class="fa fa-save me-1"></i>
                Save Changes
            </button>
            <button type="button" class="mx-auto pt-4 text-danger flex-grow-1" (click)="onCancelSettingsChanges()">
                <i class="fa fa-times me-1"></i>
                Cancel
            </button>
        </div>
    </div>
</form>
