<div class="">
    <div class="p-2 p-md-5 kndl">
        <div class="landing-wrapper d-flex flex-column h-100 rounded p-5">
            <app-kndl-about></app-kndl-about>
            <div class="flex-grow-1 d-none d-lg-flex flex-column">
                <app-kndl-service class="h-100 w-100"></app-kndl-service>
                <p appAnimateOnScroll animationClass="fade" style="transition-delay: 0.4s; transition-duration: 4s;"
                    class="lead my-5 pt-lg-5 col-lg-8 m-auto text-center">
                    We help local businesses and solo founders launch fast, look credible, be found, and grow smart with
                    complete brand kits, high-converting websites, and ongoing digital marketing support.
                </p>
                <button class="btn btn-dark p-2 px-4 rounded d-block d-lg-none" [routerLink]="'/login'">
                    Login
                </button>
            </div>
        </div>
    </div>
    <div class="p-2 p-md-5 px-0 py-md-0">
        <!-- Main body -->
        <app-kndl-about-us></app-kndl-about-us>
        <app-kndl-detailed-services></app-kndl-detailed-services>
        <app-kndl-add-ons></app-kndl-add-ons>
        <app-kndl-call-to-action></app-kndl-call-to-action>
    </div>
    <app-kndl-footer></app-kndl-footer>
</div>
<script>
    // Add this script to handle scrollspy functionality
    window.addEventListener('scroll', () => {
        const sections = document.querySelectorAll('app-kndl-about-us, app-kndl-detailed-services, app-kndl-pricing, app-kndl-add-ons');
        let currentSection = '';

        sections.forEach(section => {
            const rect = section.getBoundingClientRect();
            if (rect.top <= 0 && rect.bottom > 0) {
                currentSection = section.tagName.toLowerCase();
            }
        });

        const buttons = document.querySelectorAll('.switcher-btn');
        buttons.forEach(button => {
            button.classList.remove('active');
            if (button.textContent.trim().toLowerCase() === currentSection) {
                button.classList.add('active');
            }
        });
    });
</script>
