<!-- Display Mode -->
<div *ngIf="!editMode">
    <section class="p-5 pt-0">
        <div appAnimateOnScroll animationClass="fade-up"
            class="section-wrapper call-to-action py-5 text-center c2a rounded p-5">
            <div class="container p-0 p-lg-5">
                <h2 appAnimateOnScroll animationClass="fade-up" class="mb-4 text-white">{{ content.title }}</h2>
                <hr class="my-3 mx-auto text-white" [style.width]="content.styling.hrWidth">
                <p appAnimateOnScroll animationClass="fade-up" class="pb-3 text-white space-lines"
                    style="transition-delay: 0.2s;">{{ content.description }}</p>
                <button appAnimateOnScroll animationClass="fade-up" class="bg-tan px-5 p-3 mb-5"
                    style="transition-delay: 0.4s;" (click)="showContactForm()">{{ content.buttonText }}</button>
            </div>
        </div>
    </section>
</div>

<!-- Edit Mode -->
<div *ngIf="editMode" class="edit-mode">
    <!-- Content Section -->
    <app-generic-h2-title [title]="'Call to Action Editor'" [icon]="'fa-edit'"
        [subTitle]="'Edit Call to Action and final statement. '"></app-generic-h2-title>
    <div class="border p-4 rounded mb-4 bg-white stat-card">
        <h4 class="text-night-tan mb-3">Call to Action Content</h4>

        <div class="mb-3">
            <label for="ctaTitle" class="form-label fw-bold">Title:</label>
            <input type="text" id="ctaTitle" class="form-control" [(ngModel)]="content.title"
                (ngModelChange)="onContentChange()" placeholder="Enter call to action title">
        </div>

        <div class="mb-3">
            <label for="ctaDescription" class="form-label fw-bold">Description:</label>
            <textarea id="ctaDescription" class="form-control" rows="4" [(ngModel)]="content.description"
                (ngModelChange)="onContentChange()" placeholder="Enter call to action description"></textarea>
        </div>

        <div class="row">
            <div class="col-md-6">
                <div class="mb-3">
                    <label for="ctaButtonText" class="form-label fw-bold">Button Text:</label>
                    <input type="text" id="ctaButtonText" class="form-control" [(ngModel)]="content.buttonText"
                        (ngModelChange)="onContentChange()" placeholder="Enter button text">
                </div>
            </div>
            <div class="col-md-6">
                <div class="mb-3">
                    <label for="ctaHrWidth" class="form-label fw-bold">HR Line Width:</label>
                    <input type="text" id="ctaHrWidth" class="form-control" [(ngModel)]="content.styling.hrWidth"
                        (ngModelChange)="onContentChange()" placeholder="e.g., 200px">
                </div>
            </div>
        </div>
    </div>

    <!-- Preview Section -->
    <div class="border p-4 rounded mb-4 bg-white stat-card">
        <h4 class="text-night-tan mb-3">Live Preview</h4>
        <div class="section-wrapper call-to-action py-5 text-center c2a rounded p-5">
            <div class="container p-0 p-lg-5">
                <h2 class="mb-4 text-white">{{ content.title }}</h2>
                <hr class="my-3 mx-auto text-white" [style.width]="content.styling.hrWidth">
                <p class="pb-3 text-white space-lines">{{ content.description }}</p>
                <button class="bg-tan px-5 p-3 mb-5" (click)="showContactForm()">{{ content.buttonText }}</button>
            </div>
        </div>
    </div>
</div>
